apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: opensearches.opensearch.reclaim-the-stack.com
spec:
  group: opensearch.reclaim-the-stack.com
  names:
    kind: OpenSearch
    plural: opensearches
    singular: opensearch
    shortNames: [os]
  scope: Namespaced
  versions:
    - name: v1alpha1
      served: true
      storage: true
      additionalPrinterColumns:
        - name: Version
          type: string
          jsonPath: .status.version
        - name: Health
          type: string
          jsonPath: .status.health
        - name: Nodes
          type: integer
          jsonPath: .status.nodes
        - name: Ready
          type: string
          jsonPath: .status.conditions[?(@.type=="Ready")].status
        - name: Phase
          type: string
          jsonPath: .status.phase
      subresources:
        status: {}
      schema:
        openAPIV3Schema:
          type: object
          required: [spec]
          properties:
            spec:
              type: object
              required: [image, replicas, diskSize, resources, snapshotRepositories]
              properties:
                image:
                  type: string
                  description: OpenSearch image (e.g., opensearchproject/opensearch:<major>.<minor>.<patch>)
                  default: opensearchproject/opensearch:3.3.0
                  pattern: :[0-9]+\.[0-9]+\.[0-9]+$ # validate that the tag is in semver format
                replicas:
                  type: integer
                  description: Number of OpenSearch nodes. Lowering it migrates shards off the highest ordinal nodes before removing them.
                  minimum: 3
                  default: 3
                diskSize:
                  type: string
                  description: Size of each node's data volume as a whole number of M, G, T or P, or Mi, Gi, Ti or Pi (e.g., 100Gi). Can't be changed later since the volume claim templates of a StatefulSet are immutable. Hostpath storage (e.g., openebs-hostpath) doesn't enforce it, OpenSearch then sees the whole filesystem of its node.
                  pattern: ^[1-9][0-9]*[MGTP]i?$
                  x-kubernetes-validations:
                    - message: spec.diskSize can't be changed since the volume claim templates of a StatefulSet are immutable
                      rule: quantity(self).compareTo(quantity(oldSelf)) == 0
                resources:
                  description: |-
                    Regular Kubernetes resource requests and limits for OpenSearch nodes.
                  type: object
                  required:
                    - limits
                    - requests
                  properties:
                    limits:
                      type: object
                      x-kubernetes-preserve-unknown-fields: true
                      required:
                        - memory
                      properties:
                        memory:
                          type: string
                          description: Whole number of Mi or Gi (e.g., 8Gi), at least 4Gi. The JVM heap gets half of it, up to 31Gi.
                          pattern: ^[0-9]+(Mi|Gi)$
                      x-kubernetes-validations:
                        - message: spec.resources.limits.memory must be at least 4Gi
                          rule: quantity(self.memory).compareTo(quantity('4Gi')) >= 0
                    requests:
                      type: object
                      x-kubernetes-preserve-unknown-fields: true
                      required:
                        - memory
                      properties:
                        memory:
                          type: string
                          description: Whole number of Mi or Gi (e.g., 8Gi), at least 4Gi.
                          pattern: ^[0-9]+(Mi|Gi)$
                      x-kubernetes-validations:
                        - message: spec.resources.requests.memory must be at least 4Gi
                          rule: quantity(self.memory).compareTo(quantity('4Gi')) >= 0
                nodeSelector:
                  type: object
                  additionalProperties:
                    type: string
                tolerations:
                  type: array
                  items:
                    type: object
                    properties:
                      key:
                        type: string
                      operator:
                        type: string
                      value:
                        type: string
                      effect:
                        type: string
                config:
                  type: object
                  description: Additional OpenSearch configuration merged into config/opensearch.yml.
                  x-kubernetes-preserve-unknown-fields: true
                snapshotRepositories:
                  type: array
                  description: List of snapshot repositories that should be created in the OpenSearch cluster.
                  default: []
                  items:
                    type: object
                    required:
                      - name
                      - type
                      - bucket
                      - base_path
                      - accessKeyId
                      - secretAccessKey
                      - policies
                    properties:
                      name:
                        type: string
                        description: Repository identifier used inside OpenSearch.
                      type:
                        type: string
                        description: Backend type for the repository.
                        enum:
                          - s3
                        default: s3
                      bucket:
                        type: string
                        description: S3 bucket that stores the snapshots.
                      base_path:
                        type: string
                        description: Path prefix within the bucket.
                      endpoint:
                        type: string
                        description: Optional custom S3-compatible endpoint.
                      protocol:
                        type: string
                        description: Protocol used to connect to the endpoint.
                        enum:
                          - http
                          - https
                        default: https
                      region:
                        type: string
                        description: AWS region for the bucket.
                      accessKeyId:
                        type: object
                        description: Secret reference containing the AWS access key id.
                        required:
                          - name
                          - key
                        properties:
                          name:
                            type: string
                            description: Name of the Kubernetes Secret holding the value.
                          key:
                            type: string
                            description: Key in the Kubernetes Secret that stores the value.
                      secretAccessKey:
                        type: object
                        description: Secret reference containing the AWS secret access key.
                        required:
                          - name
                          - key
                        properties:
                          name:
                            type: string
                            description: Name of the Kubernetes Secret holding the value.
                          key:
                            type: string
                            description: Key in the Kubernetes Secret that stores the value.
                      policies:
                        type: array
                        description: Snapshot Management policies that should be created for this repository.
                        default: []
                        items:
                          type: object
                          required:
                            - name
                            - schedule
                            - max_age
                          properties:
                            name:
                              type: string
                              description: Short identifier appended to the repository name when creating the policy.
                            schedule:
                              type: string
                              description: Cron expression defining when snapshots should be taken (UTC timezone).
                            max_age:
                              type: string
                              description: Retention period after which snapshots created by this policy are deleted (e.g., 30d).
            status:
              type: object
              properties:
                observedGeneration:
                  type: integer
                  format: int64
                operatorManifestVersion:
                  type: integer
                  format: int64
                health:
                  type: string
                nodes:
                  type: integer
                version:
                  type: string
                phase:
                  type: string
                conditions:
                  type: array
                  description: Reconciled tells whether the latest generation was applied, with the error if it wasn't. Ready is True once it was applied, the cluster is reachable, not red and no rolling restart or scaling is in progress.
                  x-kubernetes-list-type: map
                  x-kubernetes-list-map-keys:
                    - type
                  items:
                    type: object
                    required: [type, status, lastTransitionTime, reason, message]
                    properties:
                      type:
                        type: string
                      status:
                        type: string
                        enum: ["True", "False", "Unknown"]
                      observedGeneration:
                        type: integer
                        format: int64
                      lastTransitionTime:
                        type: string
                        format: date-time
                      reason:
                        type: string
                      message:
                        type: string
